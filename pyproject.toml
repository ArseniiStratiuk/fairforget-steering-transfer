[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steering-transfer"
version = "0.1.0"
description = "Readable experiments on refusal-direction transfer"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "pandas==2.2.3", "huggingface-hub==1.18.0"]

[project.optional-dependencies]
notebooks = ["nbformat==5.10.4", "nbclient==0.10.4", "ipykernel==7.2.0", "matplotlib==3.10.8", "torch==2.9.1"]
judging = ["lm-format-enforcer==0.11.3"]
jev = ["typesafe-sdk==0.7.5"]
translation-review = ["openpyxl==3.1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
